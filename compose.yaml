# A board over a vault on this machine.
#
#   docker compose up
#
# VAULT is the repository to serve; it defaults to the directory you run this
# from. Sign-in is off, so use it on a machine only you can reach — or set
# AUTH=git and let the git host decide who may do what.

services:
  docket:
    image: ghcr.io/vadymdidenkolab/docket:latest
    # Swap the line above for this to run the code in this checkout:
    # build: .
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - "${VAULT:-.}:/vault"
    command:
      - serve
      - --addr=0.0.0.0:8080
      - --auth=${AUTH:-none}
      - --author=${AUTHOR:-docket <docket@localhost>}
    restart: unless-stopped
