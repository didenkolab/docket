name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # No dependencies yet, so there is no go.sum to key a cache on.
          # Turn this on together with the first `require` line.
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -o docket ./cmd/docket

      - name: Run --version
        run: |
          ./docket --version
          test -n "$(./docket --version)"
