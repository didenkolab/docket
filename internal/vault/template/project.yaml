# Project definition. Read by boards, by agents, and by the docket CLI.
key: {{.Key}}
name: {{.Name}}

# A status is a pair: a name people use, and a category machines use.
# Categories are fixed: todo | doing | done. Names are this project's own.
# The order below is the column order on the board.
statuses:
  - name: Backlog
    category: todo
  - name: Ready
    category: todo
  - name: In progress
    category: doing
  - name: In review
    category: doing
  - name: Done
    category: done
  - name: Dropped
    category: done

types:
  - task
  - bug
  - story
  - epic

priorities:
  - low
  - normal
  - high
  - urgent
