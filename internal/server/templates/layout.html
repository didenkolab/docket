{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="shell bar">
  <a class="brand" href="/">{{with .Config}}{{.Name}}{{else}}docket{{end}}</a>
  <nav>
    <a href="/">Board</a>
    <a href="/pages">Pages</a>
    {{if .You.CanWrite}}<a href="/new">New task</a>{{end}}
    {{if .You.CanConfigure}}<a href="/settings">Settings</a>{{end}}
    {{if .SignedIn}}<a href="/admin">Access</a>{{end}}
  </nav>
  <form class="search" action="/search" method="get">
    <input type="search" name="q" placeholder="Search" aria-label="Search">
  </form>
  {{if .SignedIn}}
  <span class="who" title="{{.You.Login}} — {{.You.Role}}">
    {{.You.DisplayName}} <span class="role">{{.You.Role}}</span>
  </span>
  {{end}}
  </div>
</header>
<main>
<div class="shell">
{{end}}

{{define "foot"}}
</div>
</main>
</body>
</html>
{{end}}
