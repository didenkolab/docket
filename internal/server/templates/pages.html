{{template "head" .}}

<h1>Pages</h1>

{{if .You.CanWrite}}<p><a class="button-link" href="/pages/new">New page</a></p>{{end}}

<ul class="pages">
  {{range .Data}}
  <li><a href="/page/{{.}}">{{.}}</a></li>
  {{else}}
  <li class="empty">The knowledge base is empty. Pages live under <code>docs/</code>.</li>
  {{end}}
</ul>

{{template "foot" .}}
